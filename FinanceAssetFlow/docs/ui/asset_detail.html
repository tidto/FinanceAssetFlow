<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset Detail Mockup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p class="muted">투자자산</p>
        <h1>삼성전자 주식</h1>
      </div>
      <a class="button" href="dashboard.html">뒤로</a>
    </header>
    <main>
      <section class="detail-panel">
        <p class="label">현재 평가금액</p>
        <p class="value">3,240,000원</p>
        <div class="row">
          <div>
            <p class="label">매입금액</p>
            <p class="amount">3,000,000원</p>
          </div>
          <div>
            <p class="label">평가손익</p>
            <p class="amount positive">+240,000원</p>
          </div>
          <div>
            <p class="label">수익률</p>
            <p class="amount positive">+8.0%</p>
          </div>
        </div>
        <p class="muted" style="margin-top: 12px;">분기마다 평가금액을 수동으로 갱신</p>
        <div class="actions">
          <a class="button" href="asset_edit.html">수정</a>
          <button>삭제</button>
        </div>
      </section>

      <section class="section">
        <h2>변경 이력</h2>
        <div class="history-item">
          <div class="row">
            <strong>평가금액 갱신</strong>
            <span class="muted">2026.06.12</span>
          </div>
          <p class="muted">3,000,000원에서 3,240,000원으로 변경</p>
        </div>
        <div class="history-item">
          <div class="row">
            <strong>자산 등록</strong>
            <span class="muted">2026.06.01</span>
          </div>
          <p class="muted">매입금액 3,000,000원 등록</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
